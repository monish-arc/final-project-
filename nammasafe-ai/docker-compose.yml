version: "3.8"

services:
  # ============================================================================
  # 1. PostgreSQL with PostGIS Spatial Database
  # ============================================================================
  db:
    image: postgis/postgis:15-3.3
    container_name: nammasafe-db
    restart: always
    environment:
      POSTGRES_USER: nammasafe
      POSTGRES_PASSWORD: nammasafe123
      POSTGRES_DB: nammasafe_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nammasafe -d nammasafe_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nammasafe-network

  # ============================================================================
  # 2. Python FastAPI Backend Service & Decision Engine
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nammasafe-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://nammasafe:nammasafe123@db:5432/nammasafe_db
      JWT_SECRET: nammasafe-super-secret-key-chamoli-2025
      PILOT_DISTRICT: Chamoli
      PILOT_STATE: Uttarakhand
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nammasafe-network

  # ============================================================================
  # 3. React Vite GIS Frontend Platform
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nammasafe-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - nammasafe-network

volumes:
  pgdata:
    driver: local

networks:
  nammasafe-network:
    driver: bridge
